name: This is Maven project workflow. 
on:
 workflow_dispatch:
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
     - name: code checkout
       uses: actions/checkout@v4.2.2 #we can pass here commit id.
     - name: Setup Java JDK
       uses: actions/setup-java@v3.14.1
       with:
        java-version: '17'
        distribution: 'microsoft'
        
        
       
       
       
